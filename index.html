<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altgriechisch für Kinder 🏛️</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #eef7ff;
            text-align: center;
            padding: 20px;
            color: #2c3e50;
            margin: 0;
        }
        h1 { color: #0056b3; margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 20px; }
        
        /* Navigation / Modi */
        .mode-buttons { margin-bottom: 25px; }
        .nav-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #2980b9;
            transition: all 0.1s;
            margin: 0 5px;
        }
        .nav-btn:active { transform: translateY(4px); box-shadow: none; }
        
        /* Buchstaben-Raster */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border: 3px solid #f1c40f;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.05); }
        .letter { font-size: 2.2rem; color: #e74c3c; font-weight: bold; }
        .name { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        .sound { color: #16a085; font-size: 0.85rem; margin-top: 3px; }
        
        /* Modal für das Schreibfeld */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 20px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        canvas {
            border: 3px dashed #3498db;
            border-radius: 15px;
            background: #fffdf0;
            cursor: crosshair;
            touch-action: none;
        }
        
        /* Quiz-Bereich */
        #quiz-container {
            display: none;
            background: white;
            max-width: 500px;
            margin: 20px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 3px solid #2ecc71;
        }
        .quiz-target { font-size: 4rem; color: #2c3e50; margin: 15px 0; }
        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .option-btn {
            background-color: #ecf0f1;
            border: 2px solid #bdc3c7;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .option-btn:hover { background-color: #d5dbdb; }
        #quiz-feedback { font-size: 1.2rem; font-weight: bold; margin-top: 15px; min-height: 30px; }

        /* Allgemeine Buttons */
        button.action-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.95rem;
            border-radius: 10px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }
        button.clear-btn { background-color: #e74c3c; }
        button.close-btn { background-color: #95a5a6; }
    </style>
</head>
<body>

    <h1>🏛️ Altgriechisch für Kids</h1>
    <p class="subtitle">Lerne die Buchstaben zu schreiben, erkennen und auszusprechen!</p>

    <div class="mode-buttons">
        <button class="nav-btn" onclick="showAlphabet()">🔤 Alphabet lernen</button>
        <button class="nav-btn" onclick="startQuiz()">🎮 Quiz-Spiel</button>
    </div>

    <div class="grid" id="alphabet-grid"></div>

    <div id="quiz-container">
        <h2>Finde den richtigen Namen!</h2>
        <div class="quiz-target" id="quiz-letter">?</div>
        <button class="action-btn" onclick="speakQuizLetter()">🔊 Buchstaben hören</button>
        <div class="quiz-options" id="quiz-options"></div>
        <div id="quiz-feedback"></div>
    </div>

    <div class="modal" id="write-modal">
        <div class="modal-content">
            <h2 id="modal-title">Schreibübung</h2>
            <p>Spure den Buchstaben nach:</p>
            <canvas id="paint-canvas" width="260" height="260"></canvas>
            <br>
            <button class="action-btn" onclick="speakCurrentLetter()">🔊 Hören</button>
            <button class="action-btn clear-btn" onclick="clearCanvas()">🗑️ Löschen</button>
            <button class="action-btn close-btn" onclick="closeModal()">❌ Fertig</button>
        </div>
    </div>

    <script>
        // Das vollständige altgriechische Alphabet (24 Buchstaben)
        const alphabet = [
            { char: 'Α α', name: 'Alpha', sound: 'A wie Apfel', speak: 'Alpha' },
            { char: 'Β β', name: 'Beta', sound: 'B wie Ball', speak: 'Beta' },
            { char: 'Γ γ', name: 'Gamma', sound: 'G wie Garten', speak: 'Gamma' },
            { char: 'Δ δ', name: 'Delta', sound: 'D wie Dose', speak: 'Delta' },
            { char: 'Ε ε', name: 'Epsilon', sound: 'Kurzes E wie Ente', speak: 'Epsilon' },
            { char: 'Ζ ζ', name: 'Zeta', sound: 'Weiches Z (dz)', speak: 'Seta' },
            { char: 'Η η', name: 'Eta', sound: 'Langes E wie Esel', speak: 'Eta' },
            { char: 'Θ θ', name: 'Theta', sound: 'Hauch-T (th)', speak: 'Theta' },
            { char: 'Ι ι', name: 'Iota', sound: 'I wie Igel', speak: 'Iota' },
            { char: 'Κ κ', name: 'Kappa', sound: 'K wie Katze', speak: 'Kappa' },
            { char: 'Λ λ', name: 'Lambda', sound: 'L wie Lampe', speak: 'Lambda' },
            { char: 'Μ μ', name: 'My', sound: 'M wie Maus', speak: 'Mi' },
            { char: 'Ν ν', name: 'Ny', sound: 'N wie Nest', speak: 'Ni' },
            { char: 'Ξ ξ', name: 'Xi', sound: 'X wie Xylophon', speak: 'Xi' },
            { char: 'Ο ο', name: 'Omikron', sound: 'Kurzes O wie Ordner', speak: 'Omikron' },
            { char: 'Π π', name: 'Pi', sound: 'P wie Pinguin', speak: 'Pi' },
            { char: 'Ρ ρ', name: 'Rho', sound: 'Gerolltes R', speak: 'Rho' },
            { char: 'Σ σ/ς', name: 'Sigma', sound: 'S wie Sonne', speak: 'Sigma' },
            { char: 'Τ τ', name: 'Tau', sound: 'T wie Tiger', speak: 'Tau' },
            { char: 'Υ υ', name: 'Ypsilon', sound: 'Ü wie Überraschung', speak: 'Ypsilon' },
            { char: 'Φ φ', name: 'Phi', sound: 'F wie Fisch', speak: 'Phi' },
            { char: 'Χ χ', name: 'Chi', sound: 'CH wie Buch', speak: 'Chi' },
            { char: 'Ψ ψ', name: 'Psi', sound: 'PS wie Psyche', speak: 'Psi' },
            { char: 'Ω ω', name: 'Omega', sound: 'Langes O wie Oma', speak: 'Omega' }
        ];

        let currentSpeakText = '';
        let currentQuizItem = null;
        const grid = document.getElementById('alphabet-grid');

        // Alphabet-Kacheln erzeugen
        alphabet.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="letter">${item.char}</div>
                <div class="name">${item.name}</div>
                <div class="sound">${item.sound}</div>
            `;
            card.onclick = () => openPractice(item);
            grid.appendChild(card);
        });

        // Sprachausgabe (Vorlesen)
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'el-GR';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentLetter() { speak(currentSpeakText); }
        function speakQuizLetter() { if(currentQuizItem) speak(currentQuizItem.speak); }

        // Modal & Malfeld Logik
        const modal = document.getElementById('write-modal');
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        function openPractice(item) {
            currentSpeakText = item.speak;
            document.getElementById('modal-title').innerText = `${item.name} (${item.char})`;
            modal.style.display = 'flex';
            clearCanvas();
            speak(item.speak);
            
            // Wasserzeichen als Spurbild einzeichnen
            ctx.fillStyle = "#e0e0e0";
            ctx.font = "110px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const smallLetter = item.char.split(' ')[1] || item.char;
            ctx.fillText(smallLetter, canvas.width / 2, canvas.height / 2);
        }

        function closeModal() { modal.style.display = 'none'; }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function startPosition(e) { painting = true; draw(e); }
        function finishedPosition() { painting = false; ctx.beginPath(); }
        function draw(e) {
            if (!painting) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#0056b3';

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', finishedPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', finishedPosition);
        canvas.addEventListener('touchmove', draw);

        // Navigation Modus-Wechsel
        function showAlphabet() {
            document.getElementById('alphabet-grid').style.display = 'grid';
            document.getElementById('quiz-container').style.display = 'none';
        }

        // Quiz Logik
        function startQuiz() {
            document.getElementById('alphabet-grid').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            nextQuizQuestion();
        }

        function nextQuizQuestion() {
            document.getElementById('quiz-feedback').innerText = '';
            
            // Zufälligen Buchstaben auswählen
            const randomIndex = Math.floor(Math.random() * alphabet.length);
            currentQuizItem = alphabet[randomIndex];
            
            document.getElementById('quiz-letter').innerText = currentQuizItem.char;
            speakQuizLetter();

            // 3 falsche Optionen aussuchen
            let options = [currentQuizItem];
            while(options.length < 4) {
                const randomOption = alphabet[Math.floor(Math.random() * alphabet.length)];
                if(!options.includes(randomOption)) {
                    options.push(randomOption);
                }
            }
            
            // Optionen mischen
            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.name;
                btn.onclick = () => checkAnswer(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption) {
            const feedback = document.getElementById('quiz-feedback');
            if(selectedOption === currentQuizItem) {
                feedback.style.color = '#2ecc71';
                feedback.innerText = '🎉 Richtig! Super gemacht!';
                setTimeout(nextQuizQuestion, 1500);
            } else {
                feedback.style.color = '#e74c3c';
                feedback.innerText = '❌ Versuch es nochmal!';
            }
        }
    </script>
</body>
</html>
